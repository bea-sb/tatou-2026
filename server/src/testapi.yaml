#Schemathesis fuzzing scope
#Run only against a test instance with disposable test data.
#Verify database deletion and filesystem deletion separately.

#yaml is supposed to help schemathesis in what api looks like and what
#requests it could test and responses to get Fuzzing thang

openapi: 3.0.3
info:
  title: tatou API Fuzzer
  version: 1.0.0

#authentication
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer #token bearer

#first test Great success
#just sen a GET to /healthz and recieve 200 for Great success
paths:
  /healthz:    #checks /healthz
    get:
      responses:
        "200": #cussess
          description: Great success for healthz checkingg
#send GET request to the /healthz path and expect HTTP 200 as the response
#only need security scheme is flask check that ur logged in possibly @auth.required
#just like delete and upload

# the real BUISSNESS
  /api/upload-document:

    post:
      summary: Upload a PDF in tatou as user :)


      security:
        - BearerAuth: []

    
      requestBody: #what data to send with
        required: true
        content:
          multipart/form-data: #sort of data
            schema:
              type: object
              required:
                - file #file must be woth
              properties:
                file:
                  type: string
                  format: binary
                name: # name should probably be string because we got error that numbers accepted in upload
                  type: string # instead of type: string, integer here
                  minLength: 1
                  maxLength: 255 #must be string and not work empty string and have max length
                  #  - type: string
                  #  - type: integer

      responses:
        "201":
          description: PDF uploaded Great sucess :D
        "400":
          description: strange upload data
        "401":
          description: Authentication required login needed
        "503":
          description: Database error stuff





  /api/delete-document:
    
    delete:
      summary: Delete a PDF using a query parameter
      security:
        - BearerAuth: []

      parameters:  #how schemathesis should go about the request
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1

      
      responses:
        "200": #success
          description: Deletion result
        "400":
          description: Invalid document ID
        "401":
          description: Authentication required
        "404":
          description: Document not found
        "503":
          description: Database error

    post:

      summary: Delete a PDF using a JSON body
      security:
        - BearerAuth: []

  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id

  
              properties:
                id:
                  type: integer
                  minimum: 1


      responses:
        "200":
          description: Deletion result
        "400":
          description: Invalid document ID
        "401":
          description: Authentication required
        "404":
          description: Document not found
        "503":
          description: Database error



  /api/delete-document/{document_id}:

    delete:

      summary: Delete a PDF by document id

      security:
        - BearerAuth: []


      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer #must be number and no less than 1
            minimum: 1

    
      responses:
        "200":
          description: Deletion result
        "400":
          description: Invalid document ID
        "401":
          description: Authentication required
        "404":
          description: Document not found
        "503":
          description: Database error